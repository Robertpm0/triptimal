version: "3.9"

services:

  app:
    build: .
    container_name: triptimal

    restart: unless-stopped

    ports:
      - "8000:8000"

    depends_on:
      - redis

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

  redis:
    image: redis:7-alpine

    container_name: triptimal-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

volumes:
  redis-data: